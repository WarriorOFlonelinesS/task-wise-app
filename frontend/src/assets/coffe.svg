<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 160" width="256" height="320">
    <title>Coffee cup with taller animated steam</title>
    <desc>Hand-drawn cup outline; turquoise steam rises higher above the cup in animation.</desc>
  
    <style>
      .cup {
        fill: none;
        stroke: #000;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .steam path {
        fill: none;
        stroke: #34d5d2;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        animation: rise 4s linear infinite;
      }
      .steam path:nth-child(2) { animation-delay: 1s; }
      .steam path:nth-child(3) { animation-delay: 2s; }
  
      @keyframes rise {
        0%   { transform: translateY(0px); transform:translateX(-20px); opacity: 0; }
        10%  { opacity: 1; }
        80%  { opacity: 1; }
        100% { transform: translateY(-50px); opacity: 0; }
      }
    </style>
  
    <!-- CUP -->
    <path class="cup" d="M20 56h63a2.8 2.8 0 0 1 2.8 2.8v39.4c0 11.6-9.4 21-21 21H41c-11.6 0-21-9.4-21-21V58.8A2.8 2.8 0 0 1 22.8 56Z"/>
    <path class="cup" d="M24 56c8 2.2 20 3.5 31.5 3.5S79 58.2 88 56"/>
    <path class="cup" d="M86 68h12a14 14 0 0 1 0 28H86"/>
  
    <!-- STEAM (higher rise) -->
    <clipPath id="rimClip">
      <rect x="18" y="10" width="92" height="46" />
    </clipPath>
  
    <g class="steam" clip-path="url(#rimClip)">
      <path d="M52 64c-4 6 4 10 4 18s-8 10-4 18" />
      <path d="M64 64c-3 6 5 10 5 18s-8 10-5 18" />
      <path d="M76 64c-4 6 4 10 4 18s-8 10-4 18" />
    </g>
  </svg>
  